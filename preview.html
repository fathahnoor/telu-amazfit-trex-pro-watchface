<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TEL-U Watchface Preview</title>
<style>
  body { background: #1a1a1a; color: #eee; font-family: sans-serif; display: flex; gap: 40px; padding: 40px; align-items: flex-start; }
  .watch { border-radius: 50%; overflow: hidden; box-shadow: 0 0 40px rgba(237,30,40,.3); }
  .watch img { display: block; width: 480px; height: 480px; image-rendering: pixelated; }
  .info { max-width: 420px; }
  .info img { max-width: 100%; margin: 8px 0; border: 1px solid #333; background: #000; }
  h1 { font-size: 20px; } .red { color: #ED1E28; }
</style>
</head>
<body>
  <div class="watch"><img src="assets/preview/preview_360.png" alt="preview 360"></div>
  <div class="info">
    <h1>TEL-U Watchface <span class="red">— mockup 360×360</span></h1>
    <p>bg.png</p><img src="assets/360x360/bg.png" width="180">
    <p>branding.png &nbsp; ampm.png</p>
    <img src="assets/360x360/branding.png" style="width:auto">
    <img src="assets/360x360/ampm.png" style="width:auto">
  </div>
</body>
</html>
